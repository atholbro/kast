[versions]
binaryCompatibilityValidator = "0.18.1"
coroutines = "1.10.2"
detekt = "1.23.8"
dnsJava = "3.6.4"
# @keep used manually in jib configs, see app/build.gradle.kts
eclipseTemurin = "25_36-jre-alpine-3.22@sha256:bf9c91071c4f90afebb31d735f111735975d6fe2b668a82339f8204202203621"
gradleFilterVersions = "0.1.16"
gradleUpdateVersions = "1.1.0"
gradleVersions = "0.53.0"
# @keep used manually for jacoco config, see build.gradle.kts
jacoco = "0.8.13"
jib = "3.5.3"
jib-javaagent = "0.10.0"
junit = "6.0.3"
# @keep jvm target
jvm = "17"
kotest = "6.1.7"
kotlin = "2.3.20"
kotlinLogging = "3.0.5"
kotlinter = "5.4.2"
ktor = "3.4.1"
logbackClassic = "1.5.32"
micrometer = "1.16.4"
mockk = "1.14.9"
nmcp = "1.4.4"
opentelemetry = "1.60.1"
opentelemetryAgent = "2.26.0"
prometheus = "1.5.1"
slf4j = "2.0.17"

[libraries]
dnsjava = { module = "dnsjava:dnsjava", version.ref = "dnsJava" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinLogging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlinLogging" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logbackClassic" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
opentelemetry-extensionKotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin", version.ref = "opentelemetry" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetryAgent" }
prometheus-jvmMetrics = { module = "io.prometheus:prometheus-metrics-instrumentation-jvm", version.ref = "prometheus" }
slf4j-julBridge = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }

[bundles]
ktor-micrometer = [
    "ktor-server-micrometer",
    "micrometer-prometheus",
    "prometheus-jvmMetrics",
]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
]
opentelemetry = [
    "opentelemetry-extensionKotlin",
    "slf4j-julBridge",
]

[plugins]
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
gradleVersions = { id = "com.github.ben-manes.versions", version.ref = "gradleVersions" }
gradleVersions-filter = { id = "se.ascp.gradle.gradle-versions-filter", version.ref = "gradleFilterVersions" }
gradleVersions-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "gradleUpdateVersions" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
jib-javaagent = { id = "com.ryandens.javaagent-jib", version.ref = "jib-javaagent" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
