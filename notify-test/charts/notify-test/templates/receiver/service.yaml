apiVersion: v1
kind: Service
metadata:
  name: {{ include "notifyTest.receiver.fullname" . }}
  labels:
    {{- include "notifyTest.receiver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.receiver.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "notifyTest.receiver.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notifyTest.nameConcat" (list (include "notifyTest.receiver.name" .) "notify") }}
  labels:
    {{- include "notifyTest.receiver.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: 9000
      targetPort: notify
      protocol: UDP
      name: notify
  selector:
    {{- include "notifyTest.receiver.selectorLabels" . | nindent 4 }}
